name: listing watch

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "last_seen.txt"       # the daily heartbeat must not retrigger the run
      - "README.md"
  schedule:
    # Asks for every 5 minutes. GitHub's free-tier scheduler ignores most of
    # these (measured ~2.5h actual cadence), which is why each run polls
    # internally for 5.5 hours — see timeout-minutes below.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send another confirmation email"
        type: boolean
        default: false

# Least privilege. This repo is public, so the built-in token gets nothing it
# does not need — alerts are written to a PRIVATE repo using ALERT_TOKEN, never
# to this one. `contents` is only for the daily heartbeat commit.
permissions:
  contents: write

env:
  # This repo's Actions logs are public. Never print a watch name, a listing
  # title, a seller or a URL into them.
  QUIET: "1"

jobs:
  # Runs on publish and on any manual run — never on the schedule, so it can
  # never spam. Sends the confirmation email once, then stays quiet.
  hello:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm the alert path works
        env:
          TARGETS_JSON: ${{ secrets.TARGETS_JSON }}
          ALERT_REPO: ${{ secrets.ALERT_REPO }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
        run: |
          set +e
          python check_watchexchange.py --hello
          code=$?
          # Exit 2 means the watcher can see Reddit but cannot reach you — the
          # one failure that leaves you silently unprotected. Go red so the
          # run-failure email tells you, since the alert path itself can't.
          if [ "$code" = "2" ]; then
            echo "::error::Watcher cannot deliver alerts. Check the ALERT_REPO / ALERT_TOKEN / TARGETS_JSON secrets."
            exit 1
          fi
          exit 0

  watch:
    runs-on: ubuntu-latest
    # Each run watches for ~5.5h so a run is essentially always active and
    # coverage never depends on GitHub's scheduler actually firing.
    timeout-minutes: 350
    concurrency:
      # Queue rather than cancel: an overlapping run is coverage, not waste.
      # Only the long loop is grouped — the hello email must never wait.
      group: listing-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Watch the sub
        id: watch
        env:
          TARGETS_JSON: ${{ secrets.TARGETS_JSON }}
          ALERT_REPO: ${{ secrets.ALERT_REPO }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
          PASSES: "330"         # 330 sweeps...
          GAP_SECONDS: "60"     # ...one a minute = ~5.5h of continuous cover
          SEARCH_EVERY: "5"     # the search index lags; every 5th pass is enough
        run: |
          set +e
          python check_watchexchange.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # The script alerts on its own the instant a listing appears — it does not
      # wait for the job to end, because a good listing is gone in minutes. The
      # only things left to surface are the two ways it can fail you.
      - name: Fail the run if the watcher went blind
        if: steps.watch.outputs.code == '1'
        run: |
          echo "::error::Every fetch failed — Reddit is likely blocking this runner."
          exit 1

      - name: Fail the run if an alert could not be delivered
        if: steps.watch.outputs.code == '3'
        run: |
          echo "::error::A listing matched but the alert could not be filed. Check ALERT_TOKEN has not expired."
          exit 1

      # GitHub disables scheduled workflows after 60 days of repo inactivity.
      # One commit a day is enough to prevent that.
      - name: Daily heartbeat
        if: always()
        continue-on-error: true      # housekeeping must never redden a real run
        run: |
          date -u '+%Y-%m-%d' > last_seen.txt
          git add last_seen.txt
          if ! git diff --cached --quiet -- last_seen.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "heartbeat: $(cat last_seen.txt)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} \
              || echo "Heartbeat push skipped — branch moved on. Tomorrow's run retries."
          fi
